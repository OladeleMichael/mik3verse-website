name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy to EC2 Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
      - name: Get EC2 Public IP
        id: get-ip
        run: |
          # Install AWS CLI if not available
          if ! command -v aws &> /dev/null; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi
          
          # Configure AWS credentials
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_DEFAULT_REGION=eu-north-1
          
          # Get instance public IP
          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids i-02c46c3c2d43dd87b \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "EC2_IP=$EC2_IP" >> $GITHUB_OUTPUT
          echo "Instance IP: $EC2_IP"
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mik3verse-website
            
            echo "📥 Pulling latest changes from master..."
            git pull origin master
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🔨 Building application..."
            npm run build
            
            echo "🔄 Restarting PM2..."
            pm2 restart mik3verse-website
            
            echo "✅ Deployment complete!"
            pm2 status
            pm2 logs mik3verse-website --lines 10 --nostream
      
      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "🌐 Site: http://${{ steps.get-ip.outputs.EC2_IP }}:3000"
      
      - name: Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mik3verse-website
            echo "🔄 Rolling back to previous commit..."
            git reset --hard HEAD~1
            npm run build
            pm2 restart mik3verse-website
